name: operation-parity

# Operation parity: the TS client must keep pace with the deployed Construction service.
# Fails if a live construction operation is unclassified (see scripts/check-operation-parity.mjs).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-operation-parity.mjs
