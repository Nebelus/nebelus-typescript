name: publish

# Publish @nebelus/construction to npm on a GitHub Release, via npm Trusted
# Publishing (OIDC) — no NPM_TOKEN needed. The package's trusted publisher is
# configured on npmjs.com to this repo + this workflow. Requires npm >= 11.5.1
# (installed below) and id-token: write (granted below).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No registry-url: it writes a placeholder authToken into .npmrc that makes
          # npm attempt token auth and short-circuit the OIDC (Trusted Publishing)
          # exchange. npm defaults to registry.npmjs.org anyway.
      - name: Upgrade npm (Trusted Publishing / OIDC needs >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci || npm install
      - run: npm run build
      - name: Publish (Trusted Publishing via OIDC — no token)
        run: npm publish --access public --provenance
